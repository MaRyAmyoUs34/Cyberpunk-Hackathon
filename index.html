<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORCHESTRA // MULTI_STATION</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dynamic Audio Wave Canvas Background -->
    <canvas id="studioCanvas"></canvas>

    <!-- Main Application Frame -->
    <main class="studio-container">
        
        <header class="studio-header">
            <span class="badge">VIRTUAL DIGITAL AUDIO WORKSPACE</span>
            <h1>Orchestra Station</h1>
            <p>Switch instruments below. Play using your mouse or your computer keyboard keys!</p>
            
            <!-- Instrument Selection Hub -->
            <div class="instrument-selector">
                <button class="inst-btn active" onclick="switchInstrument('piano')">🎹 GRAND PIANO</button>
                <button class="inst-btn" onclick="switchInstrument('guitar')">🎸 ACOUSTIC GUITAR</button>
                <button class="inst-btn" onclick="switchInstrument('drums')">🥁 TECHNO DRUM KIT</button>
            </div>
        </header>

        <!-- INSTRUMENT DECK 1: THE PIANO -->
        <section id="piano-deck" class="instrument-deck active-deck">
            <div class="piano-keyboard">
                <div class="piano-key white-key" data-note="261.63" data-key="A"><span>A</span></div>
                <div class="piano-key white-key" data-note="293.66" data-key="S"><span>S</span></div>
                <div class="piano-key white-key" data-note="329.63" data-key="D"><span>D</span></div>
                <div class="piano-key white-key" data-note="349.23" data-key="F"><span>F</span></div>
                <div class="piano-key white-key" data-note="392.00" data-key="G"><span>G</span></div>
                <div class="piano-key white-key" data-note="440.00" data-key="H"><span>H</span></div>
                <div class="piano-key white-key" data-note="493.88" data-key="J"><span>J</span></div>
            </div>
        </section>

        <!-- INSTRUMENT DECK 2: THE GUITAR -->
        <section id="guitar-deck" class="instrument-deck">
            <div class="guitar-fretboard">
                <div class="guitar-string-row" data-note="164.81" data-key="Q"><div class="line string-6"></div><span class="key-indicator">Q</span></div>
                <div class="guitar-string-row" data-note="220.00" data-key="W"><div class="line string-5"></div><span class="key-indicator">W</span></div>
                <div class="guitar-string-row" data-note="293.66" data-key="E"><div class="line string-4"></div><span class="key-indicator">E</span></div>
                <div class="guitar-string-row" data-note="392.00" data-key="R"><div class="line string-3"></div><span class="key-indicator">R</span></div>
                <div class="guitar-string-row" data-note="493.88" data-key="T"><div class="line string-2"></div><span class="key-indicator">T</span></div>
                <div class="guitar-string-row" data-note="659.25" data-key="Y"><div class="line string-1"></div><span class="key-indicator">Y</span></div>
            </div>
        </section>

        <!-- INSTRUMENT DECK 3: THE DRUMS -->
        <section id="drums-deck" class="instrument-deck">
            <div class="drum-matrix">
                <div class="drum-pad" data-drum="kick" data-key="Z"><h3>KICK</h3><p>[Z]</p></div>
                <div class="drum-pad" data-drum="snare" data-key="X"><h3>SNARE</h3><p>[X]</p></div>
                <div class="drum-pad" data-drum="hihat" data-key="C"><h3>HI-HAT</h3><p>[C]</p></div>
                <div class="drum-pad" data-drum="clap" data-key="V"><h3>CLAP</h3><p>[V]</p></div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
